<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daniel's Graduation · 2026</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f7f5f0;
    color: #242424;
    font-family: Georgia, "Times New Roman", serif;
}

img {
    display: block;
}

.container {
    width: min(1100px, calc(100% - 40px));
    margin: auto;
}


/* =========================
   HERO
========================= */

.hero {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 70px 0;
}

.hero-content {
    max-width: 700px;
}

.cap {
    font-size: 42px;
    margin-bottom: 30px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(45px, 8vw, 82px);
    font-weight: normal;
    letter-spacing: -3px;
    line-height: 1;
}

.year {
    margin-top: 22px;
    font: 12px Arial, sans-serif;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #888;
}

.intro {
    max-width: 500px;
    margin: 32px auto 0;
    font-size: 19px;
    line-height: 1.8;
    color: #6c6c6c;
}

.scroll {
    margin-top: 60px;
    font: 10px Arial, sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #999;
}


/* =========================
   SECTIONS
========================= */

.section {
    padding: 90px 0;
}

.section-heading {
    text-align: center;
    margin-bottom: 45px;
}

.section-heading .small {
    display: block;
    margin-bottom: 12px;
    font: 10px Arial, sans-serif;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #999;
}

.section-heading h2 {
    margin: 0;
    font-size: 38px;
    font-weight: normal;
}


/* =========================
   HIGHLIGHTS
   ALL PORTRAIT
========================= */

.highlights {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.highlight {
    overflow: hidden;
    cursor: pointer;
    background: #ddd;
    aspect-ratio: 3 / 4;
}

.highlight img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform .5s ease;
}

.highlight:hover img {
    transform: scale(1.025);
}


/* =========================
   FRIENDS
   ALL PORTRAIT
========================= */

.friends {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.friend {
    overflow: hidden;
    cursor: pointer;
    background: #ddd;
    aspect-ratio: 3 / 4;
}

.friend img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform .5s ease;
}

.friend:hover img {
    transform: scale(1.025);
}


/* =========================
   DIVIDER
========================= */

.divider {
    width: 60px;
    height: 1px;
    background: #c9c5bd;
    margin: 0 auto;
}


/* =========================
   MORE MEMORIES
========================= */

.more {
    max-width: 600px;
    margin: auto;
}

.link {
    display: block;
    padding: 20px;
    margin: 14px 0;
    border: 1px solid #d5d1c9;
    border-radius: 3px;
    text-decoration: none;
    text-align: center;
    color: #242424;
    font: 14px Arial, sans-serif;
    transition: all .25s ease;
    background: rgba(255,255,255,.3);
}

.link:hover {
    background: #242424;
    color: white;
    border-color: #242424;
}


/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 50px 0 70px;
    color: #999;
    font: 11px Arial, sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
}


/* =========================
   LIGHTBOX
========================= */

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
    z-index: 1000;
    cursor: zoom-out;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 95vw;
    max-height: 92vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

.close {
    position: fixed;
    top: 20px;
    right: 25px;
    color: white;
    font: 30px Arial, sans-serif;
    cursor: pointer;
    font-weight: 200;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .container {
        width: min(100% - 28px, 600px);
    }

    .hero {
        min-height: 80vh;
        padding: 50px 0;
    }

    .hero h1 {
        letter-spacing: -2px;
    }

    .intro {
        font-size: 17px;
    }

    .section {
        padding: 65px 0;
    }

    .section-heading h2 {
        font-size: 32px;
    }

    .highlights,
    .friends {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .highlight,
    .friend {
        aspect-ratio: 3 / 4;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 420px) {

    .highlights,
    .friends {
        grid-template-columns: 1fr;
    }

    .highlight,
    .friend {
        aspect-ratio: 3 / 4;
    }
}

</style>
</head>

        id="lightbox-image"
        src=""
        alt="Expanded graduation photo">

<script>

function openLightbox(src) {

    document
        .getElementById("lightbox-image")
        .src = src;

    document
        .getElementById("lightbox")
        .classList.add("active");
}


function closeLightbox() {

    document
        .getElementById("lightbox")
        .classList.remove("active");
}


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeLightbox();
    }

});

</script>
