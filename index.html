        }

            font-size: 42px;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(42px, 8vw, 76px);
            font-weight: normal;
            letter-spacing: -2px;
            margin: 0;
        }

        .year {
            margin-top: 14px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #777;
        }

        .intro {
            max-width: 500px;
            margin: 30px auto 0;
            font-size: 18px;
            line-height: 1.7;
            color: #666;
        }

        /* SECTION */

        .section {
            margin-bottom: 90px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title span {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 10px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 32px;
            font-weight: normal;
        }

        /* GALLERY */

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .photo {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 3px;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo:hover {
            transform: scale(1.015);
        }

        .gallery .large {
            grid-column: span 2;
            height: 520px;
        }

        /* FRIENDS */

        .friends {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .friends .photo {
            height: 300px;
        }

        /* LINKS */

        .links {
            max-width: 550px;
            margin: auto;
        }

        .link {
            display: block;
            padding: 18px 20px;
            margin: 12px 0;
            border: 1px solid #d8d4cc;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            color: #242424;
            font-family: Arial, sans-serif;
            font-size: 14px;
            transition: all 0.25s ease;
            background: rgba(255,255,255,0.35);
        }

        .link:hover {
            background: #242424;
            color: white;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding-top: 20px;
            color: #999;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 650px) {

            .container {
                padding: 45px 16px 70px;
            }

            .hero {
                padding: 30px 0 60px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery .large {
                grid-column: span 1;
                height: 400px;
            }

            .photo {
                height: 330px;
            }

            .friends {
                grid-template-columns: repeat(2, 1fr);
            }

            .friends .photo {
                height: 240px;
            }
        }
    </style>
</head>
